name: Security audit

# Deliberately NOT part of CI.
#
# `dotnet list package --vulnerable` answers a question about the global advisory
# database, not about the commit under test. A newly published advisory turns
# every open pull request red at once — including the very bump that fixes it —
# and in a repository where green CI is what merges updates, that stops the
# updates from landing exactly when they matter most. Here it reports on a
# schedule and blocks nothing.
#
# It is also the one workflow that speaks about `main` itself: Dependabot's
# security updates are switched off in this repository, so this report is the
# only place the whole picture is written down. For NuGet it is also the only
# place transitive advisories show up at all — without a lock file the
# dependency graph lists direct packages only.
#
# The report is the run's summary and its warnings, not an issue. An issue stays
# open until every advisory is fixed, which for coursework may be never, and it
# is one more thing a human has to close. The summary is on the Actions tab of
# every run, and a finding never fails the run.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nuget:
    name: dotnet list package --vulnerable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore MyDuoCards/MyDuoCards.sln

      # `dotnet list package` reports findings on stdout and still exits zero, so
      # the exit code says nothing and the output has to be read. Transitive
      # packages are included because that is where most advisories live: nothing
      # in the project file mentions them, and Dependabot cannot bump them
      # directly either — the fix is always a bump of whatever pulls them in.
      - name: Audit
        run: |
          set -euo pipefail
          report=$(dotnet list MyDuoCards/MyDuoCards.sln package --vulnerable --include-transitive)
          printf '%s\n' "$report"

          # A finding never fails the run: this workflow runs on a schedule
          # against the default branch, so a failure would pin a red check to
          # whatever commit that branch points at — permanently, since a check run
          # cannot be deleted and the mark outlives the fix.
          if grep -q 'has the following vulnerable packages' <<<"$report"; then
            detail="The solution references packages with published advisories."
            echo "::warning::${detail}"
            {
              echo "### Security audit"
              echo
              echo "${detail}"
              echo
              echo '```'
              printf '%s\n' "$report"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "No vulnerable packages reported."
            {
              echo "### Security audit"
              echo
              echo "No vulnerable packages reported."
            } >>"$GITHUB_STEP_SUMMARY"
          fi
